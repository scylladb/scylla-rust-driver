[package]
name = "scylla-cql-core"
version = "1.8.0"
edition = "2024"
rust-version = "1.88"
description = "CQL data types and primitives that form the stable public API of the ScyllaDB Rust driver."
repository = "https://github.com/scylladb/scylla-rust-driver"
readme = "../README.md"
keywords = ["database", "scylla", "scylladb", "cql", "cassandra"]
categories = ["database"]
license = "MIT OR Apache-2.0"

[package.metadata."docs.rs"]
all-features = true

[lints.rust]
unnameable_types = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(scylla_unstable)',
] }

[features]
# Enables support for CQL ser/de of Secrecy type from secrecy 0.8 crate.
secrecy-08 = ["dep:secrecy-08"]
# Enables support for CQL ser/de of Secrecy type from secrecy 0.10 crate.
secrecy-10 = ["dep:secrecy-10"]
# Enables support for CQL ser/de of time/date types from time 0.3 crate.
time-03 = ["dep:time-03"]
# Enables support for CQL ser/de of time/date types from chrono 0.4 crate.
chrono-04 = []
# Enables support for CQL ser/de of arbitrary length integer types from num-bigint 0.3 crate.
num-bigint-03 = ["dep:num-bigint-03"]
# Enables support for CQL ser/de of arbitrary length integer types from num-bigint 0.4 crate.
num-bigint-04 = ["dep:num-bigint-04"]
# Enables support for CQL ser/de of arbitrary precision decimal types from bigdecimal 0.4 crate.
bigdecimal-04 = ["dep:bigdecimal-04"]
# Enables serde::Serialize / serde::Deserialize derives for CQL value types
# (Counter, CqlDate, CqlDecimal, CqlDuration, CqlTime, CqlTimestamp, CqlTimeuuid,
# CqlVarint and their borrowed variants), as well as serde::Deserialize
# for Consistency and SerialConsistency.
# The resulting serde representations are not covered by our semver guarantees -
# they may change between driver versions. Any such change is announced in the
# release notes.
serde = ["dep:serde", "uuid/serde"]
# Enables support for CQL ser/de of all supported external types.
full-serialization = [
    "chrono-04",
    "time-03",
    "secrecy-08",
    "secrecy-10",
    "num-bigint-03",
    "num-bigint-04",
    "bigdecimal-04",
]

### UNSTABLE FEATURES ###
# Enables features for use in Python-RS Driver.
unstable-python-rs = []


[dependencies]
# Important: We use precise version of scylla-macros. This enables
# us to make breaking changes in the doc(hidden) interfaces that are
# used by macros.
scylla-macros = { version = "=1.8.0", path = "../scylla-macros" }
# FrameSlice and other parts of public API (impl SerializeValue for Bytes, BufMut in vint_encode)
bytes = "1.0.1"
# CqlTimeuuid, ser/deser of CQL UUID
uuid = "1.0"
# Easier error type creation (ValueOverflow).
thiserror = "2.0.6"
# Used by safe_format utility (Display for CqlValue).
itertools = "0.15.0"
# Not optional, because it is also used by Display impl of CqlValue.
chrono-04 = { package = "chrono", version = "0.4.32", default-features = false, features = [
    "alloc",
] }
num-bigint-03 = { package = "num-bigint", version = "0.3", optional = true }
num-bigint-04 = { package = "num-bigint", version = "0.4", optional = true }
bigdecimal-04 = { package = "bigdecimal", version = "0.4", optional = true }
time-03 = { package = "time", version = "0.3", optional = true }
secrecy-08 = { package = "secrecy", version = "0.8", optional = true }
secrecy-10 = { package = "secrecy", version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

####################
# Internal utilities
####################

# Easier deserialization of numeric types from byte arrays.
byteorder = "1.3.4"

[dev-dependencies]
assert_matches = "1.5.0"
# Used to test serde impls of CQL value types against a real, self-describing format.
serde_json = "1.0"
# Used to test serde impls of the borrowed CQL value types: unlike JSON, postcard
# is a binary format that can hand out borrowed byte slices to the deserializer.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

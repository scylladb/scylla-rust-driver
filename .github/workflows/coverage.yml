name: Code coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "branch-*"
  pull_request:
    branches:
      - "**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings --cfg scylla_unstable
  RUST_BACKTRACE: full
  # Pinned to a specific dated release rather than floating "nightly", so an
  # upstream toolchain change cannot silently break this job. Bump the date
  # deliberately when there's a reason to (a new nightly-only feature, a bug
  # fix upstream).
  NIGHTLY_TOOLCHAIN: nightly-2026-08-18

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nightly is required so cargo-llvm-cov can instrument doctests (its
      # doctest coverage support is nightly-only); the rest of this repo's CI
      # keeps using stable, this job is the only one that needs nightly.
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: llvm-tools
      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest,cargo-llvm-cov
      - name: Print rustc version
        run: rustc --version
      - name: Setup 3-node ScyllaDB cluster
        run: |
          sudo sh -c "echo 2097152 >> /proc/sys/fs/aio-max-nr"
          make up

      # From here on, every step uses `if: always()`: a failing test must not
      # skip cluster cleanup, the CCM suite, or report generation -- a broken
      # test would otherwise leave no coverage output at all to diagnose it
      # with (and would strand the docker cluster running).
      - name: Run tests with coverage
        if: always()
        run: RUST_LOG=trace make test-coverage
      - name: Stop the docker cluster
        if: always()
        run: make stop
      - name: Print the docker cluster logs
        if: always()
        run: make print-logs
      - name: Remove cluster
        if: always()
        run: make down
      - name: Install scylla-ccm
        if: always()
        run: pip3 install https://github.com/scylladb/scylla-ccm/archive/master.zip
      # continue-on-error is scoped to just this step: its only purpose is the
      # side effect of creating ~/.ccm on first run, it is not itself a test,
      # and `ccm status` legitimately exits non-zero here (no cluster exists
      # yet). Every other step in this job is a real test/report-generation
      # step whose failure should still surface in the job's overall status.
      - name: Run CCM command to create the ~/.ccm dir
        if: always()
        continue-on-error: true
        run: ccm status
      - name: Run CCM tests with coverage
        if: always()
        run: RUST_LOG=trace make ccm-test-coverage
      - name: Generate coverage report
        if: always()
        run: make coverage-report
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage report'
            echo '```'
            cargo +$NIGHTLY_TOOLCHAIN llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info

  # A job of its own, so that a refused upload can be re-run without repeating
  # the cluster and test run above. needs holds it back unless every step of
  # the coverage job passed: a failed run still writes a partial report, and on
  # main that would become the baseline later pull requests are compared
  # against. Pull requests from forks get no secrets and upload without a token,
  # which Codecov accepts only for their owner:branch form; neither that nor a
  # Dependabot run, which gets no CODECOV_TOKEN, fails on a refused upload. A
  # fork's own push runs have no token and no Codecov project, so they skip the
  # job.
  codecov:
    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    needs: coverage
    if: github.repository == 'scylladb/scylla-rust-driver'
    timeout-minutes: 10
    steps:
      # Codecov matches lcov.info's paths against the checkout's file list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: coverage-report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-report/lcov.info
          disable_search: true
          # The CLI's gcov, Xcode and coverage.py plugins have nothing to find here.
          plugins: noop
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

name: Rust

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "branch-*"
  pull_request:
    branches:
      - "**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings --cfg scylla_unstable
  RUST_BACKTRACE: full
  rust_min: 1.88.0 # <- Update this when bumping up MSRV

jobs:
  static_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: clippy, rustfmt
      - name: Print rustc version
        run: rustc --version
      - name: Print rustfmt version
        run: cargo fmt --version
      - name: Print clippy version
        run: cargo clippy --version

      # Formatting
      - name: Format check
        run: cargo fmt --all -- --check

      # Verify scylla-cql[-core] imports
      - name: scylla-cql-[core] imports
        run: make check-cql-imports

      # Basic clippy checks
      - name: Clippy check
        run: cargo clippy --all-targets
      - name: Clippy check with all features
        run: cargo clippy --all-targets --all-features

      # Verify scylla-cql separately
      - name: Clippy scylla-cql
        run: cargo clippy --all-targets -p scylla-cql --features "full-serialization"

      # Verify scylla-cql-core separately
      - name: Clippy scylla-cql-core
        run: cargo clippy --all-targets -p scylla-cql-core --features "full-serialization"

      # Features checks.
      # No features.
      - name: Cargo check without features
        run: cargo check --all-targets -p scylla --features ""

      # All features.
      - name: Cargo check with all features
        run: cargo check --all-targets -p scylla --all-features

      # Various (de)serialization features.
      - name: Cargo check with all serialization features
        run: cargo check --all-targets -p scylla --features "full-serialization"
      - name: Cargo check with metrics feature
        run: cargo check --all-targets -p scylla --features "metrics"
      - name: Cargo check with secrecy-08 feature
        run: cargo check --all-targets -p scylla --features "secrecy-08"
      - name: Cargo check with chrono-04 feature
        run: cargo check --all-targets -p scylla --features "chrono-04"
      - name: Cargo check with time-03 feature
        run: cargo check --all-targets -p scylla --features "time-03"
      - name: Cargo check with num-bigint-03 feature
        run: cargo check --all-targets -p scylla --features "num-bigint-03"
      - name: Cargo check with num-bigint-04 feature
        run: cargo check --all-targets -p scylla --features "num-bigint-04"
      - name: Cargo check with bigdecimal-04 feature
        run: cargo check --all-targets -p scylla --features "bigdecimal-04"

      # TLS-related feature sets.
      - name: Cargo check with openssl-x feature
        run: cargo check --all-targets -p scylla --features "openssl-010"
      - name: Cargo check with rustls-x feature
        run: cargo check --all-targets -p scylla --features "rustls-023"
      - name: Cargo check with rustls-x and openssl-x features
        run: cargo check --all-targets -p scylla --features "rustls-023" --features "openssl-010"

      # unstable-cpp-rs feature.
      - name: Cargo check with unstable-cpp-rs feature
        run: cargo clippy --all-targets --features "unstable-cpp-rs"

      # unstable-nodejs-rs feature.
      - name: Cargo check with unstable-nodejs-rs feature
        run: cargo clippy --all-targets --features "unstable-nodejs-rs"

      # unstable-host-listener feature.
      - name: Cargo check with unstable-host-listener  feature
        run: cargo clippy --all-targets --features "unstable-host-listener"

      # unstable-reconnect-policy feature.
      - name: Cargo check with unstable-reconnect-policy feature
        run: cargo clippy --all-targets --features "unstable-reconnect-policy"

      # unstable-client-routes feature.
      - name: Cargo check with unstable-client-routes feature
        run: cargo check --all-targets -p scylla --features "unstable-client-routes"

      # unstable-strong-consistency feature.
      - name: Cargo check with unstable-strong-consistency feature
        run: cargo check --all-targets -p scylla --features "unstable-strong-consistency"

      # No scylla_unstable flag with features
      - name: Cargo check without scylla_unstable
        run: RUSTFLAGS="-Dwarnings" cargo clippy --all-features --tests --examples # No benches, because they require unstable features.

      # No scylla_unstable flag without features
      - name: Cargo check without scylla_unstable and features
        # If we pass --tests or --examples here, feature unification turns on some features anyway,
        # so we only check the main target.
        run: RUSTFLAGS="-Dwarnings" cargo clippy -p scylla

      # cargo-deny checks (licenses, advisories, bans, sources) based on deny.toml
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: nextest
      - name: Print rustc version
        run: rustc --version
      - name: Setup 3-node ScyllaDB cluster
        run: |
          sudo sh -c "echo 2097152 >> /proc/sys/fs/aio-max-nr"
          make up
      # We need to run doctests separately, because nextest doesn't support them :(
      # https://github.com/nextest-rs/nextest/issues/16
      - name: Run doctests
        run: cargo test --doc --all-features
      - name: Run tests
        run: |
          RUST_LOG=trace cargo nextest run --all-features
      - name: Check for stale test keyspaces
        run: cargo run --bin find_stale_test_keyspaces
      - name: Stop the docker cluster
        if: ${{ always() }}
        run: make stop
      - name: Print the docker cluster logs
        if: ${{ always() }}
        run: make print-logs
      - name: Remove cluster
        run: make down
      - name: Install scylla-ccm
        run: pip3 install https://github.com/scylladb/scylla-ccm/archive/master.zip
      - name: Run CCM command to create the ~/.ccm dir
        continue-on-error: true
        run: ccm status
      - name: Run CCM tests
        run: RUST_LOG=trace make ccm-test

  # The examples need both prerequisites in place: most talk to the plain cluster
  # from the compose file, while a few need a cluster it cannot provide - TLS,
  # password authentication, two datacenters, published client routes - and bring
  # up their own with scylla-ccm, as the ccm tests do. So both are set up first,
  # and then a single step runs them all.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - name: Print rustc version
        run: rustc --version
      - name: Install scylla-ccm
        run: pip3 install https://github.com/scylladb/scylla-ccm/archive/master.zip
      - name: Setup 3-node ScyllaDB cluster
        run: |
          sudo sh -c "echo 2097152 >> /proc/sys/fs/aio-max-nr"
          docker compose -f test/cluster/docker-compose.yml up -d --wait
      - name: Run the examples
        run: ./scripts/run-examples.sh
      - name: Print the docker cluster logs
        if: ${{ always() }}
        run: docker compose -f test/cluster/docker-compose.yml logs
      - name: Remove cluster
        if: ${{ always() }}
        run: docker compose -f test/cluster/docker-compose.yml down

  # Tests that our current minimum supported rust version compiles everything sucessfully
  min_rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust ${{ env.rust_min }}
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.rust_min }}
      - name: Print Rust version
        run: rustc --version
      - name: MSRV cargo check with features
        run: cargo check --all-targets -p scylla --all-features
      - name: MSRV cargo check without features
        run: cargo check --all-targets -p scylla

  # Tests that docstrings generate docs without warnings
  cargo_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - name: Compile docs
        run: RUSTDOCFLAGS=-Dwarnings cargo doc

  docs_rs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-docs-rs
      - run: cargo docs-rs -p scylla
      - run: cargo docs-rs -p scylla-cql
      - run: cargo docs-rs -p scylla-cql-core
      - run: cargo docs-rs -p scylla-macros
      - name: Check scylla public API for scylla_cql leaks
        run: make check-rustdoc-leaks

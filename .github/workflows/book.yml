# This workflow builds the book with documentation and checks that
# book_tests.rs is up to date with the book chapters.
# Book code examples are now tested via `cargo test --doc` as part of
# the normal test suite (see the book_tests module in scylla crate).
name: Book

on:
  push:
    branches:
    - main
    - 'branch-*'
  pull_request:
    branches:
    - '**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
    - name: Install mdbook
      uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
      with:
        tool: mdbook
    - name: Build the book
      run: mdbook build docs
    - name: Check book_tests.rs is up to date
      run: make check-book-tests

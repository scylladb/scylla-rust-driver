# This workflow builds the book with documentation and checks that
# book_tests.rs is up to date with the book chapters.
# Book code examples are now tested via `cargo test --doc` as part of
# the normal test suite (see the book_tests module in scylla crate).
name: Book

on:
  push:
    branches:
    - main
    - 'branch-*'
  pull_request:
    branches:
    - '**'
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
    - name: Install mdbook
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
      with:
        tool: mdbook
    - name: Build the book
      run: mdbook build docs
    - name: Check book_tests.rs is up to date
      run: make check-book-tests
